<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعهد ولي الأمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<header>
  <h1>تعهد ولي الأمر</h1>
  <p>الموافقة على مشاركة الطالب في نشاط الاعتكاف</p>
</header>
<main>
  <section class="card" id="formCard">
    <label>اسم ولي الأمر</label>
    <input id="guardian" placeholder="الاسم الثلاثي" autocomplete="name">
    <label>اسم الطالب</label>
    <input id="student" placeholder="الاسم الثلاثي">
    <label>المسجد</label>
    <input id="mosque" placeholder="اسم المسجد">
    <label>اليوم</label>
    <select id="day">
      <option value="">اختر اليوم</option>
      <option>السبت</option><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option>
    </select>
    <label>التاريخ</label>
    <input id="date" type="date">
    <label>رقم التواصل</label>
    <input id="phone" type="tel" placeholder="09xxxxxxxx" inputmode="tel">
    <label>التوقيع <span class="hint" style="display:inline;font-weight:400">(وقّع بإصبعك داخل الإطار)</span></label>
    <canvas id="sig"></canvas>
    <div class="row">
      <button class="secondary" type="button" id="clearSig">مسح التوقيع</button>
    </div>
    <div class="row">
      <button type="button" id="makeBtn">إنشاء الملف</button>
    </div>
    <div id="formStatus" class="status"></div>
  </section>

  <section class="card hidden" id="resultCard">
    <p style="margin-top:0;font-weight:700">هذا هو الملف الجاهز:</p>
    <img id="preview" alt="معاينة الملف">
    <div id="saveStatus" class="status"></div>
    <div class="row">
      <button class="whatsapp" type="button" id="shareBtn">إرسال عبر واتساب</button>
      <button type="button" id="downloadBtn">تنزيل الملف PDF</button>
    </div>
    <div class="row">
      <button class="ghost" type="button" id="backBtn">تعديل البيانات</button>
    </div>
  </section>
</main>
<footer>في حال وجود صعوبة، يمكن للمسؤول استلام نسخة الملف مباشرة.</footer>

<canvas id="page" width="1240" height="1754" class="hidden"></canvas>
<script src="app.js"></script>
</body>
</html>
