<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المسؤول</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1793259829">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js?v=1793259829"></script>
<script src="render.js?v=1793259829"></script>
</head>
<body>
<header><h1>لوحة المسؤول</h1><p>التعهدات المستلمة</p></header>
<main>
  <section class="card" id="login">
    <label>كلمة المرور</label>
    <input id="key" type="password">
    <div class="row"><button id="loginBtn">دخول</button></div>
    <div id="loginStatus" class="status"></div>
  </section>

  <section class="card hidden" id="settings">
    <h3 style="margin:0 0 6px">بيانات المبيت</h3>
    <p class="hint" style="margin:0">تُكتب في ملف PDF لكل طالب تختاره.</p>
    <label>المسجد</label>
    <input id="s_mosque">
    <label>اليوم</label>
    <select id="s_day">
      <option value="">اختر اليوم</option>
      <option>السبت</option><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option>
    </select>
    <label>التاريخ</label>
    <input id="s_date" type="date">
  </section>

  <section class="card hidden" id="list">
    <div class="row" style="margin:0 0 10px">
      <button id="pdfBtn" disabled>تنزيل الملف (0)</button>
      <button class="secondary" id="refresh">تحديث</button>
    </div>
    <div id="pdfStatus" class="status"></div>
    <div id="count" class="hint"></div>
    <div id="groups"></div>
  </section>
</main>
<canvas id="page" width="1240" height="1754" class="hidden"></canvas>
<script src="admin.js?v=1793259829"></script>
</body>
</html>
